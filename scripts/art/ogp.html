<!doctype html><html lang="ja"><head><meta charset="utf-8">
<!-- SNS で共有したときの画像（OGP）。1200×630 で撮る -->
<style>
html,body{margin:0;width:1200px;height:630px;overflow:hidden;background:#111}
.wrap{position:relative;width:1200px;height:630px;display:flex;align-items:center;justify-content:center;gap:56px;background:radial-gradient(circle at 30% 50%,#1f1a0e 0,#111 60%)}
.wrap::after{content:"";position:absolute;inset:24px;border:1px solid #9f7916}
img{width:300px;height:auto}
.name{font-family:Futura,"Avenir Next Condensed",sans-serif;font-weight:700;font-size:96px;letter-spacing:.08em;color:#dfa910;line-height:1}
.sub{margin-top:20px;font-family:"Hiragino Sans",sans-serif;font-size:28px;letter-spacing:.2em;color:#d9cfa8}
</style></head><body>
<div class="wrap"><img src="../../public/images/logo/logo-mark.svg" alt=""><div><div class="name">BUN &amp; CO.</div><div class="sub">クラフトバーガー専門店</div></div></div>
</body></html>
